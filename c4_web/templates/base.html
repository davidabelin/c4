<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Connect4 Lab: drop discs against agents that forecast your next move, then train and benchmark your own.">
    <meta name="theme-color" content="#8a1f2f">
    <title>{% block title %}Connect4{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/c4.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <script>
      window.__APP_BASE_PATH__ = {{ (request.script_root or "")|tojson }};
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="bg-orb bg-orb-a" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-b" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.home') }}">
        <img class="brand-mark" src="{{ url_for('static', filename='icons/c4.svg') }}" alt="" width="22" height="22">
        <span>Connect4 <span class="brand-sub">Lab</span></span>
      </a>
      <nav class="site-nav" aria-label="Connect4 Lab">
        <a href="{{ url_for('main.home') }}"{% if request.path == "/" %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('main.play_page') }}"{% if request.path == "/play" %} aria-current="page"{% endif %}>Play</a>
        <a href="{{ url_for('main.arena_page') }}"{% if request.path == "/arena" %} aria-current="page"{% endif %}>Arena</a>
        <a href="{{ url_for('main.training_page') }}"{% if request.path == "/training" %} aria-current="page"{% endif %}>Training</a>
        <a href="{{ url_for('main.rl_page') }}"{% if request.path == "/rl" %} aria-current="page"{% endif %}>RL</a>
        {% if drl_home_url %}
        <a class="nav-return" href="{{ drl_home_url }}">AIX Hub</a>
        {% endif %}
      </nav>
    </header>
    <main class="page" id="main">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-copy">
          <img class="copyleft-mark" src="{{ url_for('static', filename='icons/copyleft.svg') }}" alt="" aria-hidden="true" width="16" height="16">
          <span>2026 Connect4 Lab</span>
        </p>
        <nav class="footer-links" aria-label="Connect4 footer">
          <a href="{{ url_for('main.home') }}"{% if request.path == "/" %} aria-current="page"{% endif %}>Connect4 Lab</a>
          {% if drl_home_url %}
          <a href="{{ drl_home_url }}">AIX Hub</a>
          {% endif %}
        </nav>
      </div>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
